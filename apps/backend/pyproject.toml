[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "flaremailer-backend"
version = "0.1.1"
description = "Flaremailer transactional email backend and delivery worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.32.0,<1",
  "cryptography>=50.0.2,<51",
  "email-validator>=2.3.0,<3",
  "fastapi>=0.161.0,<1",
  "httpx>=0.28.1,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1.6,<4",
  "pydantic-settings>=2.16.1,<3",
  "sqlalchemy[asyncio]>=2.1.6,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1,<1",
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.17.2,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true
